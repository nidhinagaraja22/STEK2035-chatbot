chutz und engagiert sich auch international. Ziel ist, die Umweltsituation zu verbessern und die natürlichen Lebensgrundlagen zu schützen. Zahlreiche Auszeichnungen zeigen, dass Heidelberg auf dem richtigen Weg ist. Erfolgreicher Umweltschutz braucht möglichst viele Beteiligte. Um jeden Einzelnen zum Mitmachen zu motivieren, nimmt die Stadt viel Geld in die Hand. Hinweis: För", "doc": "website_html", "auth": 2}]}, {"id": "q05", "category": "Stadtentwicklung", "q_type": "factual", "question": "Was ist die Bahnstadt und welche Rolle spielt sie?", "draft_answer": "Die Bahnstadt ist ein neues Stadtquartier auf ehemaliger Bahnfläche und gilt als größte Passivhaussiedlung der Welt. Sie erhielt 2014 den Passive House Award und ist Vorbild nachhaltiger Stadtentwicklung.", "expected_authority": 2, "is_citizen_opinion": false, "answerable": true, "pool": [{"uid": "doc::2015_Stadtentwicklungsplan::50", "text": "Kinderfreundlichkeitsprüfung) in eine konsequente Sozialverträglichkeitsprüfung überführt werden, die für alle soziale Qualitäten sichert. Bahnstadt als Schlüsselprojekt für die Stadtentwicklung Mit gesamtstädtischem Engagement für den neuen Stadtteil Bahnstadt sollen diese Leitlinien auch praktisch umgesetzt und erlebbar gemacht werden. Die Bahnstadt wird nicht nur ein wichtiger neuer Arbeitsplatzstandort, sondern leistet einen wesentlichen Beitrag, um die Herausforderungen des Demographischen ", "doc": "stadtentwicklungsplan_2015", "auth": 2}, {"uid": "website_pdf::230703_A4_Statusbericht_STEK_RZ6_web.pdf::14", "text": "Naturschutz? Nur eine sensibilisierte Stadtgesellschaft geht achtsam mit ihrer Umwelt um, gleiches gilt für Ämter und Entschei - dungstragende. Immer wieder kommt es in Heidelberg zum Beispiel zu Konflikten mit Freizeitnutzungen in Naturschutzflächen. Große Bedeutung hat also die Sensibilisie - rung G für Umwelt- und Naturschutz auf allen Ebenen. Dazu gehören nachhaltiger Konsum G und die Sichtbar - machung von Auswirkungen menschlichen Handelns auf die Umwelt. Es geht um Aufklärung, Kommunikati", "doc": "web_pdf_statusbericht", "auth": 2}, {"uid": "doc::12_pdf_STEK_Nachhaltigkeitsbericht_2025::34", "text": "Stadt und lokale Bedürfnisse Ziel Zielformulierung SDG 5.1 Offen sein: Internationale Stadt mit starker lokaler Tradition 5.2 Wissenschaft und Forschung zum Motor der Stadtentwicklung machen 5.3 Attraktiv für Fachkräfte sein: Vielfältiger, weltoffener Wirtschaftsstandort mit guten Arbeitsbedingungen 5.4 Kultur für alle zugänglich machen und dynamisch halten 5.5 Engagement und Identifikation für die Stadt stärken 5.6 Tourismus nachhaltig gestalten 5.7 Globale Verantwortung im Blick behalten 5.1 O", "doc": "nachhaltigkeitsbericht_2025", "auth": 2}, {"uid": "website_pdf::15_pdf_Neubuerger_Broschuere.pdf::20", "text": "schaffen. Diese können von Tieren als Wanderkorridore genutzt werden. Weitere Informationen zu diesen und weiteren Naturschutzaktivitäten gibt es unter www.heidelberg.de/ naturundlandschaft . Nachhaltiger Konsum Mit Projekten rund um das Thema „nachhaltiger Konsum“ möchte die Stadt Heidelberg die Bürgerinnen und Bür - ger dazu ermutigen, sich der Verant - wortung als Konsumenten bewusst zu werden und bei alltäglichen Einkaufs - entscheidungen an einer nachhaltigen Entwicklung mitzuwirken. Unter ", "doc": "web_pdf_neubuerger_de", "auth": 3}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::34", "text": "Urban Farming könnte ebenfalls ein für Heidelberg bedeutender Trend werden, wenn auf dem ehemaligen Airfield dafür im Rahmen eines Landwirtschaftsparks Flächen vorgehalten werden. Das Konzept der Kreislaufwirtschaft findet immer mehr Einzug in städtische Planungen, bei dem Abfall und Ressourcen effizienter genutzt werden und wird daher als Modellprojekt in die Planung des PHV einbezogen. Auch die Verbesserung der Mobilitätsinfrastruktur durch Sharing Modelle, Elektromobilität und sichere, gut au", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::2015_Stadtentwicklungsplan::15", "text": "der ÖP hochwertige Architektur mit höchster Energieeffizienz kombinieren. Der Passive House Award wurde in den Kategorien Einfamilienhäuser, Mehrfamilienhäuser, Sonderbauten Bürogebäude, Sanierungen, Weiterbildungseinrichtungen, Schulen und Kitas sowie Regionen vergeben und ging neben der Bahnstadt an ein Reihenhaus in Philadelphia,", "doc": "website_html", "auth": 2}, {"uid": "website_html::Heidelberg_Bahnstadt.html::0", "text": "Bahnstadt Klimaneutrale Stadtentwicklung und neuer Wohnraum Die Bahnstadt ist eines der größten Stadtentwicklungsprojekte in ganz Deutschland und gleichzeitig eine der größten Passivhaus-Siedlungen der Welt. In zentraler Lage von Heidelberg findet sich die Bahnstadt auf dem Gelände eines früheren Güterbahnhofs, Mit 116 Hektar ist der junge Stadtteil größer als die Heidelberger Altstadt. Mehr als 6.800 Menschen werden künftig dort leben, weitere 6.000 dort arbeiten - vor allem in Forschung und wi", "doc": "website_html", "auth": 2}, {"uid": "website_html::Umwelt+und+Nachhaltigkeit.html::0", "text": "Umwelt & Nachhaltigkeit Konsequent grün und sauber Heidelberg handelt. Umwelt- und Klimaschutz hat in Heidelberg Tradition. Über Jahrzehnte hinweg hat sich die Neckarstadt ihren Ruf als Umwelt- und Nachhaltigkeits-Hauptstadt mit vielen Netzwerk-Partnern erarbeitet. Bereits 1992 verabschiedete Heidelberg als erste deutsche Großstadt ein kommunales Klimaschutzkonzept. Zurzeit entsteht in Heidelberg die weltweit größte Passivhaussiedlung im neuen Stadtteil Bahnstadt , die beim internationalen Wettb", "doc": "website_html", "auth": 2}, {"uid": "website_html::_Passive+House+Award+2014_+fuer+die+Bahnstadt.html::0", "text": "„Passive House Award“ für die Bahnstadt Die Heidelberger Bahnstadt ist „Passivhaus-Region des Jahres“. Beim internationalen Wettbewerb „Passive House Award 2014“ hatten sich weltweit mehr als 100 Projekte aus 20 Ländern in insgesamt sechs Kategorien beworben. Die Preisträger wurden bei der 18. Internationalen Passivhaus-Tagung in Aachen am 25. April 2014 bekannt gegeben. Das Passivhaus Institut hatte den Award im Rahmen des EU-Projekts „Passive House Regions with Renewable Energies“ (PassREg) au", "doc": "website_html", "auth": 2}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::96", "text": "120 | Cluster 6 – Ziele Cluster 6 – Ziele | 121 Urbane Data Plattform – faktenbasierte Entscheidungsgrundlage Um effektive und innovative Projekte umzusetzen, setzt die Stadtverwaltung vermehrt auf ämterübergreifendes Arbeiten. Die Vernetzung von Informa tionen und Daten aus den Fachbereichen hilft, Planungen zu erleichtern und effizient Projekte umzusetzen. Daten schaffen eine bessere Grundlage für faktenbasierte Entscheidungen. Mit evidenzbasierten Maßnahmen werden neue Antworten auf komplexe ", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "website_html::Umwelt+Auszeichnungen.html::0", "text": "Auszeichnungen für nachhaltiges Engagement Umwelt-, Klima- und Naturschutz hat in Heidelberg eine lange Tradition. Für sein vielfältiges Engagement hat Heidelberg zahlreiche Preise und Auszeichnungen erhalten. Heidelberg ist \"Global Green City\" : Im Hauptquartier der Vereinten Nationen in New York wurde Heidelberg 2015 mit dem Global Green City Award ausgezeichnet. Mit diesem Award werden jährlich ein oder mehrere Städte geehrt, die sich weltweit vorbildlich für eine nachhaltige Entwicklung eins", "doc": "website_html", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::15", "text": "und Mangel an begrünten Flächen in vielen Teilen des bebauten Stadtgebietes zu den das Stadtklima prägenden Überwärmungs- und bioklimatischen Belastungseffekten. Typische Parknutzungen finden eher in den umliegenden Landschaftsräumen statt und die Erholungs-, Freizeit- und Sportflächen liegen vorrangig in den Übergangsbereichen zu diesen Landschaftsräumen. Obwohl der Freiflächenanteil MRO 2035+ Raumstrategie Heidelberg 3.1 Zusammenfassung der MRO-Analyse Status quo und Trends im Stadtgebiet sank", "doc": "mro_konzeptbericht", "auth": 2}]}, {"id": "q06", "category": "Bürgerbeteiligung", "q_type": "factual", "question": "Wie können Bürgerinnen und Bürger sich am STEK beteiligen?", "draft_answer": "Bürger wurden durch Online-Beteiligung, aufsuchende Formate an Stadtfesten und Märkten sowie thematische Arbeitstreffen in den STEK-Prozess eingebunden.", "expected_authority": 4, "is_citizen_opinion": false, "answerable": true, "pool": [{"uid": "website_pdf::230703_A4_Statusbericht_STEK_RZ6_web.pdf::26", "text": "Eintreten für demokratische Werte? Die Beteiligung G der Bürgerinnen und Bürger an städti - schen Entscheidungsprozessen ist ein zentrales Gut un - serer demokratischen Grundordnung. Wie können Menschen erreicht werden, die sich bisher noch nicht engagiert haben? Wie kann die Beteiligung G der Bürgerschaft in Entscheidungsprozessen in Zukunft inklusiv und unabhängig von finanziellen Möglichkeiten oder Bildungsniveau gestaltet werden? Und welche Rolle kommt den Interessensvertretungen in den jewe", "doc": "web_pdf_statusbericht", "auth": 2}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::71", "text": "Veränderungen erklärt und ihre Vorteile aufzeigt. Dies schafft Akzeptanz und ermöglicht die aktive Beteiligung G der Bevölkerung an den Prozessen. Bildung für nachhaltige Entwicklung fördert somit das Verständnis für komplexe Zusammenhänge und die Bereitschaft, positive Veränderungen mitzugestalten. Auf diese Weise trägt sie maßgeblich zur Erreichung der Ziele des STEK bei. Der allumfassende Gedanke des nachhaltigen Handelns, der im Nachgang zur Agenda 2030 G im Konzept der Bildung für nachhalti", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "website_html::Buergerbeteiligung.html::0", "text": "Bürgerbeteiligung Heidelberg hat was vor. Bist du dabei? In Heidelberg ist Bürgerbeteiligung ein fester Bestandteil städtischer Projekte. Auf Grundlage der Leitlinien mitgestaltender Bürgerbeteiligung können sich Bürgerinnen und Bürger frühzeitig einbringen, online oder vor Ort. Hier finden Sie aktuelle Beteiligungsmöglichkeiten, Informationen zu laufenden Projekten sowie einen Überblick darüber, wie Bürgerbeteiligung in Heidelberg funktioniert. Beteiligungstermine Aktuelle Veranstaltungen, Work", "doc": "website_html", "auth": 2}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::1", "text": "Festival an der PH Heidelberg • Samstag, : Parkfest im „Bella Park“ in Bergheim • Sonntag, : „Schaufenster des Sports“ auf de Neckarwiese • Freitag, : Wochenmarkt in Kirchheim • Freitag, : Elisabeth von Thadden Platz / Kerwe-Platz in Wieblingen • Sonntag : Emmertsgrundfest • Sonntag, 21.7. Sommerfest am Haus der Jugend Die Ergebnisse der Onlinebeteiligung und der ergänzenden aufsuchenden Formate werden nachfolgen zusammenfassen dargestellt. Im Anhang sind alle Beiträge im Originalwortlaut dokume", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "website_html::prozess+und+beteiligung.html::0", "text": "Prozess und Beteiligung Die Entwicklung des STEK basiert auf einem breiten Beteiligungsprozess mit den Heidelberger Bürgerinnen und Bürgern, zivilgesellschaftlichen Gruppen und Netzwerken, der Stadtverwaltung und der Kommunalpolitik. Zwischen 2022 und 2025 wurden über 30 Beteiligungsformate durchgeführt, an denen sich mehrere Tausend Menschen beteiligten und über 10.000 Beiträge in den Prozess einbrachten. Ein zentrales Ziel der Beteiligung war es, niedrigschwellige und inklusive Dialog- und Bet", "doc": "website_html", "auth": 2}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::7", "text": "11 10 | Beteiligung: Zukunft gestalten! WORKSHOPS ZUR HEIDELBERGER STADTENTWICKLUNG Im Frühjahr 2023 diskutierten über 300 Teilnehmende in fünf thematischen Workshops über die Herausforderungen und Zukunftsfragen der Heidelberger Stadtentwicklung. Eingeladen wurden zu jedem Workshop Akteure aus sehr unterschiedlichen Bereichen der Stadtgesellschaft, beispielsweise Kultur- und Sportvereine, soziale Träger, die Wohnungswirtschaft, Vertretungen der Region, Gemeinderatsmitglieder sowie Akteure aus N", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "website_html::01_07_2025+wegweiser+fuer+innovative+und+nachhaltige+stadt.html#anker5701108::4", "text": "begrünt werden. Der Neckar und der Stadtwald sind Frischluftschneisen und verbessern das Stadtklima. Um den Ausstoß von Treibhausgasen zu verringern, investiert Heidelberg in erneuerbare Energien und umweltfreundliche Mobilität. Bürgerinnen und Bürger sollen sich in Zukunft auch an diesen Investitionen selbst direkt beteiligen können. Geplant sind Windkraftanlagen im Odenwald, die Nutzung von Fluss- und Abwasserwärme sowie Geothermie. Beispiele sind die geplante Flusswärmepumpe an der Ernst-Walz", "doc": "website_html", "auth": 2}, {"uid": "doc::AK STEK 2035_Dokumentation 1_Sitzung_09_11_23_kein::0", "text": "AUFTAKTTREFFEN ARBEITSKREIS STADTENTWICKLUNGSKONZEPT (STEK) 2035 09. NOVEMBER 2023 | 17:30-20:30UHR BUSINESS DEVELOPMENT CENTER HEIDELBERG DOKUMENTATION ARBEITSKREIS STEK ERSTELLT DURCH IM AUFTRAG DER STADT HEIDELBERG BEGRÜSSUNG & ORIENTIERUNG Frau Dr. Bloem, Amtsleiterin des Amts für Stadtentwicklung und Statistik, begrüßte die Teilnehmenden und stellte das Stadtentwicklungskonzept (STEK) als planerisches Instrument mit seinen Entwicklungsschritten und dem begleitenden Beteiligungsprozess vor. ", "doc": "ak_sitzung_1_2023", "auth": 4}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::0", "text": "ERSTELLT DURCH & CO. KG IM AUFTRAG DER STADT HEIDELBERG ONLINE BETEILIGUNG UND AUFSUCHENDE FORMATE ZUM STADTENTWICKLUNGSKONZEPT (STEK) 2035 ERSTELLT DURCH & CO. KG IM AUFTRAG DER STADT HEIDELBERG HINTERGRUND Vom bis zum fand eine Online-Beteiligung zum Stadtentwicklungskonzept (STEK) 2035 statt. Ziel war es, zusätzlich zu den Formaten vor Ort eine temporäre, niedrigschwellige und einfache Beteiligungsmöglichkeit für alle Heidelbergerinnen und Heidelberger zu schaffen. Gegenstand der Beteiligung ", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::STEK 2035_Arbeitstreffen_17_06_24_Dokumentation::19", "text": "und auf das Thema Wohnungsnot. Bezogen auf die Frage „Welche vulnerablen Gruppen müssen wir besonders im Blick behalten?“ diskutierten die Teilnehmenden, ob es sinnvoll sei, zwischen vulnerablen und nicht vulnerablen Gruppen zu unterscheiden. Außerdem wurde mit Blick auf die Corona-Pandemie der Begriff „systemrelevanter“ Gruppen diskutiert. Als mögliche vulnerable Gruppen wurden identifiziert: Kinder und Jugendliche, ältere und Pflegebedürftige, Flüchtlinge, Mobilitätseingeschränkte, einsame Men", "doc": "arbeitstreffen_2024", "auth": 4}, {"uid": "doc::12_pdf_STEK 2035_Dokumentation_Zukunft gestalten_25_06_24::2", "text": "Schmidt-Lamontain (Bürgermeister für das Dezernat Klimaschutz, Umwelt und Mobilität) Dr. Gabriela Bloem (Amtsleiterin Amt für Stadtentwicklung und Statistik) Tobias Schäfer (Projektleiter STEK im Amt für Stadtentwicklung und Statistik) Björge Köhler (Urbanista, Büro für Stadtentwicklung) Die Präsentation der Talkrunde 2 finden Sie im Anhang dieser Dokumentation. DOKUMENTATION ÖFFENTLICHE VERANSTALTUNG AM 25. JUNI 2024 ERSTELLT DURCH & CO. KG IM AUFTRAG DER STADT HEIDELBERG ERGEBNISSE THEMENSTATI", "doc": "zukunft_gestalten_2024", "auth": 4}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::5", "text": "+ Stadt im Stress WAS IST DAS STEK? PHASE 2 – ZIELE FÜR HEIDELBERG PH AS E – W E G E Z UM ZIE L F ÜR HEID ELBER G DER WEG Sommer 2022 GRÜNDUNG DER PROJEKTGRUPPE Sommer 2023 VERÖFFENTLICHUNG STATUSBERICHT Winter 2022/23 5 STAKEHOLDERWORKSHOPS UND WORKSHOP MIT ZUFÄLLIG AUSGEWÄHLTEN BÜRGERINNEN UND BÜRGERN Frühjahr 2025 ABSCHLIESSENDER ARBEITSKREIS Herbst 2023 ERSTER ARBEITSKREIS Sommer 2025 BESCHLUSS IM GEMEINDERAT Herbst 2025 ÖFFENTLICHE VER ANSTALTUNG – RÜCKKOPPLUNG Herbst 2022 ERSTE GROSSE VERW", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "doc::STEK 2035_Dokumentation_Wege zu den Zielen_11_12_24::11", "text": "versch idelberg behandelt, der durch bessere Zugänglichkeit und Uferpflege gestärkt werden soll.", "expected_authority": 1, "is_citizen_opinion": false, "answerable": true, "pool": [{"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::50", "text": "Orte für Begegnung und Austausch: Sitzgelegenheiten, Trinkwasser/Toiletten, Barrierefreiheit, Kinder-, Familien- und Altersfreundlichkeit, Orte für Jugendliche, Sport- und Bewegungsangebote, Sauberkeit und Sicherheit, Klimaanpassung G (kühle Orte) – Niedrigschwellige G Zugänglichkeit von Orten und Angeboten sicherstellen – Projekte und Vereine bei der Gestaltung von Begegnungsorten unterstützen 70 | Cluster 3 – Ziele Cluster 3 – Ziele | 71 Ziel 3.6. Starkes Oberzentrum G für die Region – Orte fü", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::16", "text": "und -verhalten: Einige Antworten fordern eine stärkere Polizeipräsenz und ein konsequentes Vorgehen gegen Straftäter während in anderen eine weniger aggressive Polizei gewünscht wird. Öffentliche Räume: Einige Beiträge thematisieren die Notwendigkeit, die öffentliche Infrastruktur zu verbessern, insbesondere durch bessere Beleuchtung und die Reduzierung von Angsträumen. Auch der Zustand von öffentlichen Plätzen und eine mögliche Überwachung dieser werden erwähnt. ERSTELLT DURCH & CO. KG IM AUFTR", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "website_pdf::230703_A4_Statusbericht_STEK_RZ6_web.pdf::2", "text": "die Stadtentwicklung resilient und krisenfest aufgestellt werden kann, sind wichtige Fragen für das STEK 2035. Zentral dabei ist, alle Themen der Stadtentwicklung im Blick zu behalten. So legt das STEK ein besonderes Augenmerk darauf, ökologische, soziale und wirtschaftliche Ent - wicklungen gleichermaßen zu betrachten und die vielfältigen Themen zusammen zu denken. Ein wichtiger Faktor dieses integrierten Ansatzes ist es, von Anfang an Akteurinnen und Akteure aus allen Bereichen sowie der gesam", "doc": "web_pdf_statusbericht", "auth": 2}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::6", "text": "um den ökologischen Auswirkungen der Stadtentwicklung entgegenzuwirken. Förderung alternativer Wohnformen: Viele Antworten betonen die Bedeutung von gemeinschaftlichen Wohnprojekten die durch Synergieeffekte flächeneffizienter sind als traditionelle Wohnformen. Skeptische und ablehnende Haltungen: Es gibt auch Stimmen, die bezweifeln, dass eine Erhöhung der Einwohnerzahl ohne weitere Versiegelung möglich ist oder die ein weiteres Wachstum der Stadt ablehnen. Kontrovers diskutiert wurde auch, ob ", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::8", "text": "Biotopen und Lebensräumen für Tiere und Pflanzen aus, um die Biodiversität zu erhöhen. Reduzierung des Autoverkehrs: Viele Kommentare fordern eine Reduzierung des Autoverkehrs und die Förderung von alternativen Verkehrsmitteln wie Fahrrädern. Dies wird als wichtiger Beitrag zum Schutz der Natur gesehen. Erhalt landwirtschaftlicher Flächen: Die Bedeutung der Erhaltung landwirtschaftlicher Flächen für die Naherholung und Lebensmittelproduktion wird in vielen Beiträgen hervorgehoben. Einige Teilneh", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::52", "text": "Zugänglichkeit, weitestgehend durchgängige öffentliche Verbindungen sowie besondere Orte, die erlebbarer werden. Gleichzeitig werden weitere Gewässer in Heidelberg und Umgebung mit hohem ökologischem Anspruch gepflegt und naturnaher gestaltet.wässer in Heidelberg naturnaher gestaltet. Verbindung am Fluss schaffen Außerhalb des Stadtzentrums, in seinem weiteren Verlauf in Richtung Mannheim, bietet der Neckar im Bereich des Flora Fauna Habitat Schutzgebietes spannende Naturerlebnisräume, deren Ker", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "website_html::01_07_2025+wegweiser+fuer+innovative+und+nachhaltige+stadt.html#anker5701108::2", "text": "Handlungsbedarf besteht – etwa beim Erhalt von Grünflächen, der Weiterentwicklung von Quartieren, der Förderung von Wirtschaft oder dem Schutz vor Klimafolgen. Sie helfen, räumliche Zusammenhänge zu erkennen, geben Hinweise für zukünftige Projekte und zeigen, wo Entscheidungen und Veränderungen notwendig sind. STEK und MRO – thematische Gemeinsamkeiten Rares Gut: Fläche Beide Planwerke setzen konsequent auf das Prinzip der Innen- vor der Außenentwicklung. Neue Bauflächen im Außenbereich sind nur", "doc": "website_html", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::43", "text": "zeitnah mit hoher Priorität zu erarbeiten, da sie besonders viel Wirkung entfalten. Abbildung 11 Themencluster – Ideenfindung im Rahmen des Beratergremiums MRO THEMENANALYSE 2035+ LEBENSMITTEL WISSEN MEDIZIN KUNST BAUEN STADTKLIMA STADT AM FLUSS SCHUTZGEBIETE GESCHICHTE ÖFFENTLICHE UFER HYDROENERGIE TEMPERATUR STRUKTUR VERNETZUNG BIODIVERSITÄT NATUR RÄNDER GESCHICHTE SPORT GESUNDHEIT MAGISTRALEN ÖPNV PENDELVERKEHR FAHRRAD FUßWEGE MIV INKLUSION BETEILIGUNG LEBEN KULTUR WOHNEN STADTTEILE ANEIGNUNG", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::126", "text": "Seilbahn, ein Parkhaus der SRH... Begreift niemand die Bedeutung dieser Flächen für die Erholung der Menschen, ganz abgesehen von der Bedeutung für den Erhalt der Artenvielfalt? OB Die Berge/ Wälder rund um HD. Fahrradwege (auch Fernradwege) Neckar OB Wald, Fluss, Seen (leider weiter weg) OB Wald und Feld OB sehr wichtig sind u.a. die bahnstadtpromenade, die schrebergärten und grünflächen in kirchheim und handschuhsheim, königsstuhl und heiligenberg als tolle wanderund spaziergehmöglichkeiten OB", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::34", "text": "dauerhaften Flächenverbund entwickeln, in dem Landwirtschaft, Forst und Freizeitaktivitäten im Einklang mit dem Umwelt- und Naturschutz stehen – Einheitliche Raumkulisse: Biotopverbund G, Kulturlandschaft G, STEK und MRO G synchronisieren und auf dieser Basis eine Anpassung des FNP G und des Landschaftsplanes G beim Nachbarschaftsverband G anstoßen – Flächen vernetzen, Verbindungen herstellen; Barrieren abbauen – Schutz der natürlichen Ressourcen und der Biodiversität bei gleichzeitiger Anpassun", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "website_html::1350391.html::0", "text": "Stadt- und Regionalentwicklung Stadt und Region nachhaltig entwickeln Heidelberg nachhaltig entwickeln. Auch in Zukunft will Heidelberg sozial verantwortlich, umweltfreundlich und wirtschaftlich erfolgreich - also nachhaltig - sein. Richtschnur für die Stadtentwicklung ist das Stadtentwicklungskonzept Heidelberg 2035 (STEK), welches aktuell erstellt wird. Mit dem STEK wird der Stadtentwicklungsplan fortgeschrieben. Das STEK versteht sich als Wegweiser für eine nachhaltige Entwicklung Heidelbergs", "doc": "website_html", "auth": 2}, {"uid": "doc::12_pdf_STEK 2035_Dokumentation_Zukunft gestalten_25_06_24::8", "text": "Trinkwasserversorgung). THEMA 5: INTERNATIONAL VERNETZTE STADT + LOKALE BEDÜRFNISSE Die allgemeinen Rückmeldungen zum Thema „International vernetzte Stadt + Lokale Bedürfnisse“ waren sehr durchmischt. Die Teilnehmenden betonten die Bedeutung von Identität und Kultur, nachhaltigem Handeln sowie einem gut funktionierenden, inklusiven öffentlichen Raum. Bei der Frage „Internationale Stadt: Wie können Menschen, die für eine gewisse Zeit in Heidelberg leben und arbeiten, gut in das lokale Leben einge", "doc": "zukunft_gestalten_2024", "auth": 4}, {"uid": "doc::STEK 2035_Dokumentation_Wege zu den Zielen_11_12_24::5", "text": "Titel? • Rad sofort assoziiert mit Verkehr/Radfahren, aber auch gut – Treffen, Beteiligung • Erfahrung in der Natur für die jungen Menschen • Wertvoll, wenn wieder Naturerlebnisse mit Landschaft – Begegnung mit Lebensmittelproduktion • Eng mit Leuten sprechen: Nächster Schritt Beteiligung • Neue Allianzen: von Herzen. Erleben stattfinden lassen • Über die Hügel, mitdenken, wie weit geht es? • Rad Begriff „exzellent“, weil verständlich • Von innen aufbauen – erstmal durchdenken – davon bekannt ma", "doc": "wege_zu_den_zielen_2024", "auth": 5}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::2", "text": "Aussichten. Heidelberg steht noch stärker als heute für einen einzigartigen Ort, an dem viele Stärken zusammenkommen: Eine weltweit führende Wissenschaftslandschaft, eine dynamische und vielfältige Wirtschaft, exzellente BildungsangeboteG, ein weltoffenes und soziales Miteinander, eine reichhaltige Kulturszene und ein einmaliger Landschaftsraum. Heidelberg hat im Jahr 2035 die weitere Vernetzung innerhalb der MetropolregionG Rhein-Neckar erfolgreich vorangetrieben. Stadt und Region sind weltweit", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::13", "text": "und speziell für Fachkräfte notwendig ist. Kinderbetreuung und Bildung: Die Verfügbarkeit von Kitaplätzen qualitativ hochwertigen Schulen und einer besseren Kinderbetreuung wird von vielen Teilnehmenden als wichtig für die Attraktivität der Stadt für Fachkräfte angesehen. Verkehr und Mobilität: Viele Antworten thematisieren die Notwendigkeit einer besseren Verkehrsanbindung und Mobilität, insbesondere durch den Ausbau des ÖPNV, die Schaffung von Pendlermöglichkeiten und die Berücksichtigung der ", "doc": "online_beteiligung_2024", "auth": 4}]}, {"id": "q08", "category": "Mobilität", "q_type": "policy", "question": "Wie wird der Radverkehr in Heidelberg gefördert?", "draft_answer": "Heidelberg fördert den Radverkehr durch Ausbau des Radwegnetzes, Radschnellwege, bessere Abstellanlagen und die RadKULTUR-Initiative als Teil des Klimamobilitätsplans.", "expected_authority": 1, "is_citizen_opinion": false, "answerable": true, "pool": [{"uid": "website_html::Fahrradfreundliches+Heidelberg.html::0", "text": "Fahrradfreundliches Heidelberg Kurze Wege von A nach B Mit dem Fahrrad kommt man in Heidelberg schnell ans Ziel. Es ist also kein Zufall, dass 2023 in der Neckarstadt 33 Prozent aller Wege mit dem Fahrrad zurückgelegt wurden, wie die Mobilitätsstudie der Technischen Universität Dresden im Rahmen eines bundesweiten Forschungsprojektes zeigt. Eine optimale Anbindung garantiert dabei das Heidelberger Radwegenetz , das zurzeit 260 Kilometer umfasst. Heidelberg will seine Attraktivität für Radfahrer ", "doc": "website_html", "auth": 2}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::280", "text": "für nachhaltige Entwicklung AB: Haus der Jugend Offenheit größer; Austauschkultur gefördert; mehr Nachhaltigkeitskonzepte; keine Schlossbeleuchtung (Feuerwerk) mehr AB: PH Mehr Kulturleben; coole Bars; vegan/ vegetarische Restaurants, die bezahlbar sind; gute Radwege; bezahlbares Wohnen; mehr Öffis AB: PH Bessere Radinfrastruktur; bezahlbarer, gemeinschaftlicher Wohnraum/ Wohnprojekte; ÖPNV; freie, kostenlose Aufenthalte AB: PH Hitzeschutz enorm entwickeln: mit mehr Bäume AB: PH viele Familien, ", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::368", "text": "Entwicklung ein Skandal. ENTSIEGELUNG! OB Deutlich mehr Möglichkeiten, sich in immer heißeren Sommern abkühlen und erholen zu können: nur 2 Freibäder für 153 000 Einwohnerinnen und Einwohner? Nicht unser Ernst! OB Weniger versiegelte Flächen, mehr Begrünung, Solar auf den Dächern (insbesondere in der Bahnstadt sehr gut möglich!) OB Weniger Autos in der Innenstadt, höhere (Park- )Kosten für große Autos, günstigerer Nahverkehr, mehr Fahrradwege, die nicht plötzlich aufhören oder über Gehwege gelei", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "website_pdf::15_pdf_Neubuerger_Broschuere.pdf::22", "text": "umfassend ausgebaut worden, unter anderem wurden eine neue Straßen - bahntrasse durch die Bahnstadt gebaut und die Haltestelle Hauptbahnhof modernisiert. Weitere Informationen dazu unter www.heidelberg-mobinetz.de . Fahrplanauskünfte des ÖPNV finden Sie unter www.vrn.de . Die Stadt Hei - delberg fördert seit 2016 den Umstieg vom Auto auf den ÖPNV mit einem Jahresticket für den öffentlichen Nah - verkehr für Bürgerinnen und Bürger, die ihr Fahrzeug freiwillig abmelden. Radwege 33 Prozent der Heid", "doc": "web_pdf_neubuerger_de", "auth": 3}, {"uid": "website_html::Umwelt+Foerderprogramme.html::0", "text": "Förderprogramme Heidelberg unterstützt Umwelt-Engagement Heidelberg setzt auf einen dauerhaften Umwelt-, Klima- und Naturschutz und engagiert sich auch international. Ziel ist, die Umweltsituation zu verbessern und die natürlichen Lebensgrundlagen zu schützen. Zahlreiche Auszeichnungen zeigen, dass Heidelberg auf dem richtigen Weg ist. Erfolgreicher Umweltschutz braucht möglichst viele Beteiligte. Um jeden Einzelnen zum Mitmachen zu motivieren, nimmt die Stadt viel Geld in die Hand. Hinweis: För", "doc": "website_html", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::63", "text": "sind unterschiedlich – von der baulichen Typologie, der sozialen bzw. gesellschaftlichen Zusammensetzung bis hin zur Funktionalität. Quartiere sind im Unterschied zu den Stadtteilen flächenmäßig kleiner und nicht klar durch Gemarkungsgrenzen definiert, nehmen aber in der Stadtplanung vor allem wegen dem Identifikationspotenzial der Bevölkerung einen hohen Stellenwert ein. Auch Wirtschaftsquartiere sind in diesem Zusammenhang zu betrachten. Eine gute Vernetzung der verschiedenen Stadtteile, Quart", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::12_pdf_STEK 2035_Dokumentation_Zukunft gestalten_25_06_24::32", "text": "das Auto nehmen. Freizeitanlage Hütte und/oder Veranstaltungsgebäude für private Feste, möglichst in jedem Stadtteil. Unsere 10-20.000 Einwohner großen Umlandgemeinden (z. B. Leimen, Nußloch, Walldorf, Dossenheim, Plankstadt etc.) verfügen über eine oder mehrere hochwertige Anlagen. Diese Gemeinden haben Typ Stadtteilgröße. Derartige Anlagen schaffen kostengünstig Lebensgefühl für die Einwohner. Viele Naturorte Alternative Bildungsmöglichkeiten für Kinder → Zugang zu politischer Partizipation fü", "doc": "zukunft_gestalten_2024", "auth": 5}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::102", "text": "Angers (Richtung Eppelheim). Auch hier ist es im Sommer extrem heiß. Sicherlich werden diese im Zuge des Neubaus der Wasserbecken ebenfalls gepflanzt. OB ERSTELLT DURCH & CO. KG IM AUFTRAG DER STADT HEIDELBERG Radwege fordern, Bäume einpflanzen, Projekte mit Kindern, Menschen von verschiedenen altern organisieren - Natürlich Heidelberg immer weiter und weiter. Schule im Wald. Sport im Wald - Kurse..dann können die Leute die positiven Erfahrung und Effekt spüren und dann auf sie aufpassen. Natur ", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::279", "text": "Parken zu nutzen und die Wege für Kinder sicherer zu machen —> Nebeneffekt: möglicherweise weniger Autos in der Stadt - Anreiz für Carsharing (spart Platzressourcen und weniger Hitze durch sich erwärmende Autos in der Sonne) OB Energieeffizienz: Gebäudesanierung, Nutzung erneuerbarer Energien. Verkehr: Förderung von ÖPNV, Radverkehr und Carsharing. Wasserverbrauch: Effizientere Bewässerungssysteme und Regenwassernutzung. Abfallmanagement: Erhöhung der Recyclingquote und Abfallvermeidung. Flächen", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "website_pdf::230703_A4_Statusbericht_STEK_RZ6_web.pdf::18", "text": "STEKbriefe Aktuell arbeitet die Stadt Heidelberg an einem Klimamobilitätsplan � Das Thema Mobilität wird im STEK aufgeführt, lehnt sich dabei aber eng an die Inhalte des Klimamobilitätsplans an� Wichtig ist für das STEK vor allem, die vielfältigen Schnittstellen zu den anderen Themen der Stadtentwicklung nicht aus dem Blick zu verlieren� Die erforderlichen Veränderungen zu weniger Umweltbelastung und hoher Erschließungsqualität setzen zweierlei voraus: Eine Wende hin zu klima - neutralen Antrieb", "doc": "web_pdf_statusbericht", "auth": 2}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::37", "text": "Feld angebunden sein, damit sie als Wohnort auch attraktiv sind. OB Stadtteil Zentren ausbauen und attraktiv machen und Stadtteile auszubauen/ auszuweiten OB Einwohnerbegrenzung sobald PHV voll ist OB Ich liebe es an Heidelberg, dass man von überall auf die grünen Berge schauen kann. Aber die Fläche Bebauung fördert die Versiegelung. Ich denke man sollte darüber nachdenken in bestimmten, am besten bergfernen Regionen höhere Bebauung zulassen könnte. Das sollte dann in einem Stadtteil konzentrier", "doc": "online_beteiligung_2024", "auth": 5}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::291", "text": "perfekt kompensiert. Auf live stream Schlossbeleuchtung. Auf unsre Start ups. Auf ihr Kulturprogramm und Kinderbetreuung/Ferienprogramm OB Die Einwohner*innen von Heidelberg sind stolz, wie weit sie im Klimaschutz bereits gekommen sind und welche Synergien daraus entstehen. Die Fernwärme ist erneuerbar und in immer mehr Bereichen verfügbar. Ein Großteil des erneuerbaren Stroms wird kostengünstig direkt in Heidelberg durch Photovoltaik auf dem eigenen Dach und durch Windkraftanlagen produziert. E", "doc": "online_beteiligung_2024", "auth": 5}, {"uid": "website_html::Umweltfreundliche+Mobilitaet.html::0", "text": "Umweltfreundlich unterwegs Heidelberg setzt auf ÖPNV und Rad Heidelberg setzt sich dafür ein, dass jeder umweltfreundlich ans Ziel kommt. Im Masterplan nachhaltige Mobilität haben Mannheim, Heidelberg und Ludwigshafen verschiedene Projekte gebündelt, die kurzfristig zu einem spürbaren Rückgang der Stickstoffdioxidbelastung führen und die Luftqualität verbessern sollen. Mit dem Förderprogramm \"Umweltfreundlich mobil\" unterstützt die Stadt Heidelberg den Umstieg auf den Öffentlichen Personennahver", "doc": "website_html", "auth": 2}, {"uid": "website_html::Mobilitaet.html::0", "text": "Mobilität Kinder- und umweltfreundlich Heidelberg fährt Rad. Laut der aktuellen Mobilitätsstudie der TU Dresden werden in Heidelberg 33 Prozent aller Wege mit dem Fahrrad zurückgelegt. Im Innenstadtbereich sind es sogar 36 Prozent. Damit gehört Heidelberg zu den fahrradaktivsten Städten Deutschlands und wurde mehrfach vom Land als Fahrradfreundliche Kommune ausgezeichnet. Zudem ist Heidelberg Modellkommune der Initiative RadKULTUR des Ministeriums für Verkehr Baden-Württemberg. Das Heidelberger ", "doc": "website_html", "auth": 2}, {"uid": "website_html::Umweltfreundliche+Mobilitaet.html::1", "text": "Fahrrad zurückgelegt wurden, wie die Mobilitätsstudie der Technischen Universität Dresden im Rahmen eines bundesweiten Forschungsprojektes zeigt. Zusätzlich zu einem großzügigen Ausbau der Radwege engagiert sich die Stadt bei der Initiative RadKULTUR des Ministeriums für Verkehr Baden-Württemberg. Bereits 2012 und erneut 2018 wurde Heidelberg vom Land als Fahrradfreundliche Kommune ausgezeichnet. Als Preis gab es 2012 eine Fahrradzählanlage, die auf der Ernst-Walz-Brücke installiert und mittlerw", "doc": "website_html", "auth": 2}]}, {"id": "q09", "category": "Stadtentwicklung", "q_type": "factual", "question": "Was passiert mit den Konversionsflächen in Heidelberg?", "draft_answer": "Konversionsflächen wie Patrick-Henry-Village werden zu neuen gemischten Stadtquartieren mit Wohn- und Gewerbenutzung entwickelt.", "expected_authority": 1, "is_citizen_opinion": false, "answerable": true, "pool": [{"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::60", "text": "Nutzungsmischung, der Dichte und Höhe, ökologischer und klimatischer Funktionen als auch der Erschließungsfunktionen und der Auswirkungen auf die Gesamtstadt planerisch auszuloten sind: – die im Funktionszusammenhang mit dem Campus Im Neuenheimer Feld stehende Entwicklung im Handschuhsheimer Neckarbogen – das großräumige Umfeld des Bahnhofes Pfaffengrund/Wieblingen – der Kirchheimer Norden mit dem Sportzentrum Mitte und der FNP-Fläche Neckarbogen Für das städtebauliche Entwicklungsprojekt “Campu", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::15", "text": "und Arbeitsflächen sollen vorzugsweise auf bereits versiegelten Arealen entstehen, um wertvolle Freiflächen zu schützen. 26 | Cluster 1 – Zielsetzung Cluster 1 – Zielsetzung | 27 Ziel 1.1. Wirtschaftliche Entwicklung, Bevölkerungswachstum und neues Wohnen flächensparend ermöglichen – Bedarfsgerechten Wohnraum entwickeln, um Bevölkerungswachstum zu ermöglichen (insbesondere durch Konversionsflächen G und mehrfache Innenentwicklung im Bestand) – Entwicklung Patrick-Henry-Village voranbringen – Ent", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "website_pdf::15_pdf_Neubuerger_Broschuere.pdf::27", "text": "entstanden. Eine Grundlage für den Anstieg sind neue Quartiere wie die Bahnstadt und die Nachnutzung bisheriger US-Militärflächen. Dynamisches Heidelberg Heidelberg ist beliebt: Viele Menschen möchten hier leben und arbeiten. Um für Menschen aller Einkommensgrup - pen ausreichend Wohn raum zu schaffen, hat der Gemeinderat 2017 ein - stimmig das Handlungsprogramm Wohnen beschlossen. Jährlich 800 neue Wohnungen sollen in den kommenden Jahren entstehen. Zudem gibt es städtische Förderprogramme für ", "doc": "web_pdf_neubuerger_de", "auth": 3}, {"uid": "website_html::01_07_2025+wegweiser+fuer+innovative+und+nachhaltige+stadt.html#anker5701108::2", "text": "Handlungsbedarf besteht – etwa beim Erhalt von Grünflächen, der Weiterentwicklung von Quartieren, der Förderung von Wirtschaft oder dem Schutz vor Klimafolgen. Sie helfen, räumliche Zusammenhänge zu erkennen, geben Hinweise für zukünftige Projekte und zeigen, wo Entscheidungen und Veränderungen notwendig sind. STEK und MRO – thematische Gemeinsamkeiten Rares Gut: Fläche Beide Planwerke setzen konsequent auf das Prinzip der Innen- vor der Außenentwicklung. Neue Bauflächen im Außenbereich sind nur", "doc": "website_html", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::88", "text": "der nördlichen Bahnstadt zu finden. Perspektivisch werden Hochpunkte im Neuenheimer Feld, SRH-Campus sowie Patrick- Henry-Village angesiedelt sein. In der westlichen Innenstadt wird insbesondere das Umfeld des Heidelberger Hauptbahnhofs, gemeinsam mit der weiteren Entwicklung in der Bahnstadt, neue Maßstäbe zur Höhenentwicklung setzen. Der sogenannte ‚Menglerbau‘, das erste Wohnhochhaus Heidelbergs, inmitten der Innenstadt in unmittelbarer Nähe zum Bismarckplatz und an der Kurfürstenanlage ist d", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::24", "text": "der Ressource ‚Fläche‘ im Wohnungsbau sind damit gut. Auch ohne die Potenziale im Innenbereich für den Wohnungsbau (Baulücken, Nachverdichtung, Stadtumbau) verfügt Heidelberg trotz anhaltend hoher Nachfrage nach Wohnraum bilanziell über ausreichend Flächenpotenziale bis zum Jahr 2035. (Stadt Heidelberg 2022) Siedlungsflächenpotenziale im Bestand Jedoch können diese Potenziale im Innenbereich einen wichtigen Beitrag zur nachhaltigen Stadtentwicklung leisten. Ihnen gehört die erste Priorität bei d", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::36", "text": "dicht besiedelten Gebieten mit hohem Entwicklungsdruck steht die Frage im Raum, wie öffentlich zugängliche Flächen - etwa Plätze und Parks - bei einer wachsenden Bevölkerung erhalten und für den höheren Nutzungsdruck qualifiziert werden können. Die Herausforderung ist, Flächen effizient zu weiterzuentwickeln und gleichzeitig die Lebensqualität der Bewohnerinnen und Bewohner zu erhöhen. So kann die langfristige Balance zwischen den verschiedenen Interessen gehalten werden. An der Schnittstelle zw", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::11", "text": "die durch das MRO 99 festgehalten wurden, sind dadurch lediglich zu einem Drittel in Anspruch genommen worden. Die Innenentwicklung fand jedoch häufig zu Lasten unversiegelter Freiflächen im Innenbereich statt, da mehr als die Hälfte der Neubauten auf diesen realisiert wurden. (Stadt Heidelberg 2021a: 12-13, 102) Insgesamt zeigte sich in den vielseitigen und innovativen Ansätzen der Umgestaltung der Konversionsflächen aber eine hohe Kompetenz im Bereich der Bestandstransformation. Die weiterhin ", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "website_html::cluster_1::0", "text": "Die Stadt soll wachsen und sich entwickeln. Attraktive Arbeits- und Bildungsangebote und hohe Lebensqualität ziehen viele Menschen, Unternehmen, Einrichtungen und Institutionen nach Heidelberg. Sie sollen aktiv gefördert werden. Trotz dieses Wachstums geht die Stadt weiterhin sparsam mit der Ressource Fläche um und trägt so auch zukünftig dem Umweltschutz Rechnung. Zusätzlich benötigte Flächen für Wohnungsbau, wirtschaftliche Entwicklung und soziale Infrastruktur werden im Bestand sowie an neuen", "doc": "cluster_1", "auth": 1}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::12", "text": "weiterer Fokus wird zukünftig auf die Bestandsoptimierung und Weiterentwicklung von bisher eher monofunktionalen Gewerbestandorten gelegt werden, da durch neue Produktions- und Arbeitsweisen hier neue Möglichkeiten für urbane integrierte Mischungen entstehen können. Von besonderer Bedeutung ist ebenfalls der Wissenschaftssektor, der sich durch einen vielfältigen Arbeitsmarkt und den Zuwachs der Beschäftigungszahlen, vor allem im Bildungs-, Gesundheits- und Forschungsbereich, auszeichnet. Dieser ", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "website_pdf::15_pdf_Neubuerger_Broschuere.pdf::28", "text": "Wohnen, Wissenschaft und Gewerbe In Heidelberg entsteht mit der Bahn - stadt ein Stadtteil mit internationalem Modellcharakter: eine der weltweit größten Passivhaus- Siedlungen. Die Bahnstadt erschließt neuen Raum zum Leben und Arbeiten mit einer lebendi - gen Mischung aus Wohnen, Wissen - schaft und Gewerbe. Hier werden etwa 6.800 Menschen leben und 6.000 Menschen arbeiten, vor allem in Forschung und wissenschaftsbasierten Unternehmen. Mit einer Gesamtfläche von 116 Hektar ist die Bahnstadt flä", "doc": "web_pdf_neubuerger_de", "auth": 3}, {"uid": "website_html::vorhaben+im+wohnungsbau.html::0", "text": "Aktuelle Vorhaben im Wohnungsbau Die Schaffung von Wohnraum für alle ist ein zentraler Aspekt des Handlungsprogramms Wohnen sowie der 10-Punkte Wohnen . Deswegen ist dort eine jährliche Zielgröße von durchschnittlich 800 neuen Wohnungen verankert. Die Zielsetzung ist durch die Bahnstadt, die Konversionsflächen sowie weitere Potenziale im Siedlungsbestand gedeckt. Das Baulandprogramm Wohnen nimmt als Steuerungsinstrument die Wohnbaulandentwicklung in 5-Jahres-Schritten in den Blick. MTV & Campbel", "doc": "website_html", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::66", "text": "also mittelständige Unternehmen, vor Ort für Heidelberg strategisch relevant sind und Flächen benötigen. 2 Gewerbegebiet Weststadt (in Erarbeitung) 2 Rahmenplan interkommunales Gewerbegebiet Heidelberg-Leimen (in Erarbeitung) 2 Heidelberg Innovation Park (hip) (in Erarbeitung) Orte der Wissenschaft fördern: Räume für weitere Wissenschaftsstandorte vorsehen Wissensaffine Wirtschafts bereiche vorsehen Heidelberg ist eine Stadt der Wissenschaft mit weltweitem Renommee. Diese Strahlkraft soll in Zuk", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::1", "text": "zu finden. Das STEK hilft uns allen dabei. Es verknüpft zentrale Themen auf umfassende Weise und schafft eine Zusammenarbeit zwischen Fachdisziplinen, Akteurinnen und Akteuren und Themenbereichen. Statt isolierter Ansätze werden die Themen der Stadtentwicklung gemeinsam betrachtet, um ganzheitliche Lösungen zu entwickeln – für eine lebenswerte Stadt und ihre Bürgerinnen und Bürger. G Erläuterungen im Glossar DYNAMISCHE ENTWICKLUNG FÖRDERN BEI SPARSAMER FLÄCHENNUTZUNG Die Stadt soll wachsen und s", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::19", "text": "Entwicklung Heidelbergs sowie für funktionierende Stadt- und Umlandbeziehungen grundsätzlich weiter benötigt wird. Dies gilt gleichermaßen für die Wirtschaftsverkehre. Eine Reduzierung des MIV ist möglich, wenn geeignete alternative Angebote zur Verfügung stehen. Die Erschließung der aktuellen Entwicklungsschwerpunkte, vor allem des Patrick-Henry-Village, wird erhebliche stadträumliche Auswirkungen auf das gesamtstädtische Gefüge haben. Aus diesem Grund sollten die unterschiedlichen Varianten de", "doc": "mro_konzeptbericht", "auth": 2}]}, {"id": "q10", "category": "Strategie", "q_type": "policy", "question": "Welche Nachhaltigkeitsziele verfolgt das STEK 2035?", "draft_answer": "Das STEK 2035 verfolgt das Ziel einer klimaneutralen, sozial gerechten und wirtschaftlich starken Stadtentwicklung, dokumentiert im Nachhaltigkeitsbericht 2025.", "expected_authority": 1, "is_citizen_opinion": false, "answerable": true, "pool": [{"uid": "website_html::nachhaltigkeit.html::0", "text": "Nachhaltigkeitskonzepte Heute an Morgen denken Heidelberg ist lebenswert. Damit das auch in Zukunft so bleibt, müssen heute möglichst viele Menschen vorausschauend für morgen handeln. Das ist die Idee von Nachhaltigkeit. Sie betrifft alle Lebensbereiche. Die Leitlinien hierzu gibt das Stadtentwicklungskonzept vor. Der Heidelberger Nachhaltigkeitsbericht (15,5 MB ) wird in regelmäßigen Abständen veröffentlicht und zeigt, wie erfolgreich die Ziele des Stadtentwicklungskonzepts umgesetzt werden. Zi", "doc": "website_html", "auth": 2}, {"uid": "doc::12_pdf_STEK_Nachhaltigkeitsbericht_2025::2", "text": "Erreichung der im STEK und den einzelnen Clustern (Themenpaare) festgelegten Zielsetzungen kontinuierlich zu überwachen und zu bewerten. Dabei bilden die Ziele des STEKs den inhaltlichen Rahmen des Monitorings und dessen sechs themenübergreifende Cluster definieren die Struktur. Die Stadt Heidelberg hat seit 2004 eine Tradition der Nachhaltigkeitsberichterstattung aufgebaut und setzt diese kontinuierlich fort. Eine wichtige Orientierung geben dabei die SDG-Indikatoren für Kommunen, bereitgestell", "doc": "nachhaltigkeitsbericht_2025", "auth": 2}, {"uid": "doc::12_PDF_STEK 2035_Dokumentation_Online-Beteiligung und aufsuchende Formate 2024::12", "text": "hat sich bis dahin in der Stadt verändert? Worauf sind die Menschen in Heidelberg besonders stolz? (112 Einträge) Nachhaltigkeit und Klimaschutz: Zahlreiche Beiträge betonen die Wichtigkeit von Klimaneutralität, den Ausbau erneuerbarer Energien (wie Solar- und Windkraft), den Erhalt von Grünflächen, Begrünung der Stadt (z.B. Fassadenbegrünung) und ERSTELLT DURCH & CO. KG IM AUFTRAG DER STADT HEIDELBERG Maßnahmen gegen Hitze wie die Pflanzung von Bäumen. Es wird auch ein nachhaltigerer Umgang mit", "doc": "online_beteiligung_2024", "auth": 4}, {"uid": "doc::12_pdf_STEK_Nachhaltigkeitsbericht_2025::58", "text": "abgebildet, was die Notwendigkeit zeigt, weitere Daten zu erschließen und nutzbar zu machen. Entwicklungsbedarf ist erkennbar besonders in den Themenfeldern: ̶ Partizipation und Teilhabe ̶ Gesundheit ̶ Integration/Inklusion ̶ Bildung für nachhaltige Entwicklung (BNE) Aktuell wird die Erhebung von Gesundheitsdaten, insbesondere im Rahmen der Einschulungsuntersuchung in Zusammenarbeit mit dem Gesundheitsamt Rhein-Neckar-Kreis vorangetrieben. Weitere Ansätze umfassen die stärkere Profilierung der b", "doc": "nachhaltigkeitsbericht_2025", "auth": 2}, {"uid": "doc::MRO 2035+_Konzeptbericht_Broschüre::117", "text": "die Entsiegelung von Oberflächen, das Schaffen von versickerungsfähigen Bodenbelägen oder die Gestaltung von Retentionsräumen. Stadtbegrünungsprogramm OASIS OASIS bezeichnet ein Projektteam, bestehend aus Stadtplanungs- sowie Landschafts- und Forstamt, welches zum Ziel hat, bestehende städtische Freiräume durch gezielte bauliche Maßnahmen sowohl klimatisch als auch stadtgestalterisch aufzuwerten. Im Vordergrund stehen hierbei unter anderem Entsiegelungs-, Begrünungs- und Verschattungsmaßnahmen s", "doc": "mro_konzeptbericht", "auth": 2}, {"uid": "website_pdf::230703_A4_Statusbericht_STEK_RZ6_web.pdf::30", "text": "| STEKbriefe Vom mittelalterlichen Minnesang, der Heidelberger Romantik und von der Bibliotheca Palatina bis zu Hip-Hop und Deutschrap – die Heidelberger Kulturlandschaft ist einzigartig und international vernetzt � Das kulturelle Angebot der Stadt strahlt mit vielen, teilweise überregional bekannten Einrichtungen in die ganze Metropolregion G aus� Diese kulturelle Bedeutung prägt Erscheinungsbild und Stadtgesellschaft nachhaltig � Ausgehend von dieser starken Ausgangsposition stellt sich die Fr", "doc": "web_pdf_statusbericht", "auth": 2}, {"uid": "doc::STEK_Stadtentwicklungskonzept 2035_A3::8", "text": "| 15 14 | Beteiligung: Zukunft gestalten! Das Stadtentwicklungskonzept (STEK) ist der Wegweiser für eine nachhaltige Entwicklung Heidelbergs bis zum Jahr 2035. Im STEK werden Ziele der Stadtentwicklung für Heidelberg dargestellt und deren Umsetzung angestoßen. Als inhaltlicher Orientierungsrahmen für das STEK dienen die Nachhaltigkeitsziele der Vereinten Nationen, die sogenannten Sustainable Development Goals (SDGs) G. Das STEK ist die Umsetzung der Agenda 2030 G auf lokaler Ebene. DAS BESONDERE", "doc": "stek_a3_strategy", "auth": 1}, {"uid": "doc::12_pdf_STEK_Nachhaltigkeitsbericht_2025::1", "text": "4. Energie- und Mobilitätswende + Teilhabe an Veränderungen ...................................................... 38 4.1 Große Investitionen in die Energiewende tätigen ...................................................................................... 40 4.2 Große Investitionen in die Mobilitätswende tätigen .................................................................................. 41 4.3 Transformation verlässlich, transparent und gerecht gestalten und Wissen austauschen ..........", "doc": "nachhaltigkeitsbericht_2025", "auth": 2}, {"uid": "doc::2015_Stadtentwicklungsplan::36", "text": "besonderen Behinderungen entgegen, sondern kann das Leben aller bereichern. Die Stadt Heidelberg will ihren Beitrag dazu leisten, dass in Heidelberg Familien- und Erwerbsarbeit gleichwertig anerkannt wird. Das Recht von Frau und Mann, Zielbereich Soziales 10. Stadt des sozialen Ausgleichs beide Lebensbereiche unabhängig von konjunkturschwachen und -starken Zeiten auch zu leben, bleibt unbezweifelt. Aus diesem Grunde sollen für Frauen relevante Dienstleistungen und Selbsthilfeaktivitäten besonder", "doc": "stadtentwicklungsplan_2015", "auth": 2}, {"uid": "doc::2015_Stadtentwicklungsplan::8", "text": "Grenzen des Wachstums zeigen sich deutlicher. Gegenüber 1974 verfügt die Stadt bei nur unwesentlich größerer Einwohnerzahl über 20.000 Arbeitsplätze und 16.000 Wohnungen mehr. Trotz der Angebotsvervon Menschen und ist damit mehr als eine nur räumliche Entwicklungsplanung: Stadtentwicklungspolitik hat ebenso einen sozialen Bezug und eine soziale Verpflichtung. Es geht dabei immer um die Frage, ob der Wunsch nach Befriedigung von individuellen Lebensentwürfen nicht öfter zurückstehen sollte zuguns", "doc": "stadtentwicklungsplan_2015", "auth": 2}, {"uid": "doc::2015_Stadtentwicklungsplan::9", "text": "die Erfordernisse sozialer und ökologischer Verträglichkeit anpasst. Die Stadt fördert das Engagement ihrer Bürger für eine gerechtere und dauerhaftere Entwicklung auf lokaler und globaler Ebene, da eine solche Entwicklung ohne die direkte Beteiligung aus der Bürgerschaft nicht möglich ist. Die Gestaltung der partnerschaftlichen Beziehungen der Stadt nach außen wird an den Zielen einer gerechten und nachhaltigen Entwicklung ausgerichtet. Der lokale Agenda 21-Prozess soll auf eine breitere gesell", "doc": "stadtentwicklungsplan_2015", "auth": 2}, {"uid": "doc::12_pdf_STEK_Nachhaltigkeitsbericht_2025::57", "text": "Beschäftigte nach Geschlecht: Quelle Bundesagentur für Arbeit; Amt für Stadtentwicklung und Statistik, Stadt Heidelberg Indikatorbeschreibung: Anzahl und Anteil der weiblichen sozialversicherungspflichtig Beschäftigten an allen SvBs je Sozialraumeinheit. Kontextinformation: In Heidelberg gibt es 2023 rund 28.000 weibliche sozialversicherungspflichtig Beschäftigte, was einem Anteil von circa 49 Prozent an allen SvBs entspricht. III. Fazit und Ausblick Der Nachhaltigkeitsbericht spiegelt die Clust", "doc": "nachhaltigkeitsbericht_2025", "auth": 2}, {"uid": "doc::2015_Stadtentwicklungsplan::11", "text": "Gestaltungsmöglichkeiten hängen in starkem Maße von der finanziellen Situation der Stadt und vom Willen der Bevölkerung Heidelbergs ab, die notwendigen Veränderungen mitzutragen, die dem Ziel einer nachhaltig wirtschaftenden und sozial gerechten Gesellschaft dienen. Bei jeglicher finanziellen Investition ist zu prüfen, ob sie dem Ziel der Nachhaltigkeit und der Sozialverträglichkeit genügt. Bei allen in Angriff zu nehmenden Maßnahmen ist deshalb darauf zu achten, dass sie so gestaltet sind, dass", "doc": "stadtentwicklungsplan_2015", "auth": 2}, {"uid": "website_html::1350391.html::0", "text": "Stadt- und Regionalentwicklung Stadt und Region nachhaltig entwickeln Heidelberg nachhaltig entwickeln. Auch in Zukunft will Heidelberg sozial verantwortlich, umweltfreundlich und wirtschaftlich erfolgreich - also nachhaltig - sein. Richtschnur für die Stadtentwicklung ist das Stadtentwicklungskonzept Heidelberg 2035 (STEK), welches aktuell erstellt wird. Mit dem STEK wird der Stadtentwicklungsplan fortgeschrieben. Das STEK versteht sich als Wegweiser für eine nachhaltige Entwicklung Heidelbergs", "doc": "website_html", "auth": 2}, {"uid": const KEY = () => "stek_gt_" + (document.getElementById("annotator").value || "anon");
let state = {};
function load(){ try{ state = JSON.parse(localStorage.getItem(KEY())||"{}"); }catch(e){ state={}; } }
function save(){ try{ localStorage.setItem(KEY(), JSON.stringify(state)); }catch(e){} updateProgress(); }
function rec(id){ return state[id] || (state[id]={relevant:{},verified_answer:null,answerable:null,authority:null,nature:null,notes:""}); }
function updateProgress(){
  const n = Object.values(state).filter(r=>Object.values(r.relevant||{}).some(Boolean)||r.answerable!==null).length;
  document.getElementById("progress").textContent = ` — ${n}/${DATA.length} bearbeitet`;
}
function render(){
  const root=document.getElementById("root"); root.innerHTML="";
  DATA.forEach(q=>{
    const r=rec(q.id);
    const d=document.createElement("div"); d.className="card"; d.id="c_"+q.id;
    let html=`<div class="q">${q.question}<span class="badge">${q.category}</span><span class="badge">${q.q_type}</span></div>`;
    html+=`<div class="row"><b>Antwort (prüfen/korrigieren):</b><br><textarea data-f="verified_answer" data-id="${q.id}">${r.verified_answer??q.draft_answer}</textarea></div>`;
    html+=`<div class="row">Beantwortbar? <select data-f="answerable" data-id="${q.id}">
      <option value="">–</option><option value="yes"${r.answerable==='yes'?' selected':''}>ja</option>
      <option value="no"${r.answerable==='no'?' selected':''}>nein</option></select>
      &nbsp; Autoritätslevel: <select data-f="authority" data-id="${q.id}">
      ${[1,2,3,4,5].map(l=>`<option value="${l}"${String(r.authority??q.expected_authority)==String(l)?' selected':''}>L${l}</option>`).join("")}</select>
      &nbsp; Art: <select data-f="nature" data-id="${q.id}">
      <option value="">–</option><option value="official"${r.nature==='official'?' selected':''}>offiziell</option>
      <option value="citizen"${r.nature==='citizen'?' selected':''}>Bürgermeinung</option>
      <option value="mixed"${r.nature==='mixed'?' selected':''}>gemischt</option></select></div>`;
    html+=`<div class="row"><b>Relevante Chunks markieren:</b></div>`;
    q.pool.forEach(c=>{
      const chk=r.relevant&&r.relevant[c.uid]?"checked":"";
      html+=`<div class="chunk"><label><input type="checkbox" data-rel data-id="${q.id}" data-uid="${c.uid}" ${chk}>
        <span class="meta">[${c.doc} · L${c.auth}]</span> ${c.text}</label></div>`;
    });
    html+=`<div class="row"><input type="text" data-f="notes" data-id="${q.id}" placeholder="Notizen" value="${r.notes||''}" style="width:60%"></div>`;
    d.innerHTML=html; root.appendChild(d);
  });
  root.addEventListener("change",onChange);
  root.addEventListener("input",onChange);
  updateProgress();
}
function onChange(e){
  const t=e.target, id=t.dataset.id; if(!id) return; const r=rec(id);
  if(t.dataset.rel!==undefined){ r.relevant=r.relevant||{}; r.relevant[t.dataset.uid]=t.checked; }
  else if(t.dataset.f){ r[t.dataset.f]=t.value; }
  save();
}
function exportJSON(){
  const out={annotator:document.getElementById("annotator").value||"anon", timestamp:new Date().toISOString(),
    records:DATA.map(q=>{const r=rec(q.id);return{id:q.id,
      relevant_chunk_ids:Object.entries(r.relevant||{}).filter(([k,v])=>v).map(([k])=>k),
      verified_answer:r.verified_answer??q.draft_answer, answerable:r.answerable, authority:r.authority??q.expected_authority,
      nature:r.nature, notes:r.notes||""};})};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="groundtruth_"+(out.annotator)+".json"; a.click();
}
document.getElementById("annotator").addEventListener("change",()=>{load();render();});
load(); render();
</script></body></html>
